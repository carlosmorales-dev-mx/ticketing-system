version: "3.9"

# Sistema de venta de entradas - Infraestructura base
# Uso: podman-compose -f deploy/podman-compose.yaml up -d

services:

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing_dev_password
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    # Activamos keyspace notifications para eventos de expiración (Ex).
    # Esto es CLAVE: cuando una reserva expira a los 10 min, Redis emite
    # un evento "expired" que el servicio Go escucha para liberar el
    # asiento automáticamente en Postgres.
    command: >
      redis-server
      --notify-keyspace-events Ex
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing-net

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    container_name: ticketing-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ticketing
      RABBITMQ_DEFAULT_PASS: ticketing_dev_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel de management (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing-net

  # Swagger UI para servir la documentación OpenAPI de forma interactiva.
  # Lee el openapi.yaml del servicio Go montado como volumen de solo lectura.
  swagger-ui:
    image: docker.io/swaggerapi/swagger-ui:latest
    container_name: ticketing-swagger-ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ../api:/openapi:ro
    networks:
      - ticketing-net

  # --- Servicios "full": la API y el frontend containerizados. ---
  # Detrás de un profile para no interferir con el flujo de desarrollo
  # habitual (go run / pnpm dev). Se activan solo con:
  #   podman-compose --profile full up -d --build
  api:
    build:
      context: ../api
      dockerfile: Containerfile
    container_name: ticketing-api
    restart: unless-stopped
    profiles: ["full"]
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://ticketing:ticketing_dev_password@postgres:5432/ticketing?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://ticketing:ticketing_dev_password@rabbitmq:5672/
      RESERVATION_TTL_SECONDS: "600"
      RESERVATION_WORKERS: "5"
      SWEEP_INTERVAL_SECONDS: "30"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketing-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Containerfile
    container_name: ticketing-frontend
    restart: unless-stopped
    profiles: ["full"]
    environment:
      # El navegador del usuario es quien llama a estas URLs
      # directamente, así que siguen siendo localhost aunque el
      # frontend corra dentro de un contenedor.
      NUXT_PUBLIC_API_BASE: http://localhost:8080
      NUXT_PUBLIC_WS_BASE: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - ticketing-net

networks:
  ticketing-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
